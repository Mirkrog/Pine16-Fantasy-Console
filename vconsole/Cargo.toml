[package]
name = "vconsole"
version = "0.5.0"
edition = "2024"
license = "Unlicense"

[lib]
name = "vconsole_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.102"
byteorder = "1.5.0"
clap = { version = "4.6.4", features = ["derive"] }
console_log = "1.1.0"
env_logger = "0.11.11"
futures = "0.3.33"
log = "0.4.33"
pixels = "0.17.1"
pollster = "0.4.0"
ringbuf = "0.5.2"
tinyaudio = "2.0.0"
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
wgpu = { version = "29.0", features = ["webgl"]}
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}
web-time = "1.1"
gloo-net = "0.7.0"
